<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HouseRecall">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#fdf6ec" stroke="#c9613a" stroke-width="2"/>

  <!-- House body -->
  <rect x="16" y="34" width="32" height="20" rx="3" fill="#c9613a"/>

  <!-- Roof -->
  <polygon points="10,36 32,14 54,36" fill="#6b4f3a"/>

  <!-- Door -->
  <rect x="26" y="44" width="12" height="10" rx="2" fill="#fdf6ec"/>

  <!-- Door knob -->
  <circle cx="35" cy="50" r="1.5" fill="#d4a843"/>

  <!-- Left window -->
  <rect x="18" y="38" width="7" height="7" rx="1.5" fill="#fdf6ec" opacity="0.9"/>
  <line x1="21.5" y1="38" x2="21.5" y2="45" stroke="#c9613a" stroke-width="1"/>
  <line x1="18" y1="41.5" x2="25" y2="41.5" stroke="#c9613a" stroke-width="1"/>

  <!-- Right window -->
  <rect x="39" y="38" width="7" height="7" rx="1.5" fill="#fdf6ec" opacity="0.9"/>
  <line x1="42.5" y1="38" x2="42.5" y2="45" stroke="#c9613a" stroke-width="1"/>
  <line x1="39" y1="41.5" x2="46" y2="41.5" stroke="#c9613a" stroke-width="1"/>

  <!-- Chimney -->
  <rect x="38" y="16" width="6" height="10" rx="1" fill="#6b4f3a"/>

  <!-- Smoke puffs -->
  <circle cx="41" cy="13" r="2.5" fill="#b89880" opacity="0.6"/>
  <circle cx="43" cy="10" r="2" fill="#b89880" opacity="0.4"/>
  <circle cx="40" cy="8"  r="1.5" fill="#b89880" opacity="0.25"/>

  <!-- Star (memory / recall symbol) -->
  <text x="29" y="31" font-size="8" fill="#d4a843" font-family="system-ui" text-anchor="middle">⭐</text>
</svg>
